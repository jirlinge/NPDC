<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8 px-4">
  <div class="max-w-lg mx-auto">
    <!-- Carte principale -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-md p-6 space-y-6">
      
      <!-- En-tête -->
      <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Préférences EVG</h1>
        <p class="text-gray-600">Partagez vos préférences pour organiser le meilleur EVG</p>
      </div>

      <!-- Formulaire -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- 1. Prénom -->
        <div class="space-y-2">
          <label for="firstName" class="block text-sm font-medium text-gray-700">
            Prénom *
          </label>
          <input 
            id="firstName"
            type="text"
            formControlName="firstName"
            placeholder="Votre prénom"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none"
            [class.border-red-500]="f['firstName'].invalid && f['firstName'].touched"
          />
          <div *ngIf="f['firstName'].invalid && f['firstName'].touched" class="text-red-500 text-sm" aria-live="polite">
            Le prénom est requis
          </div>
        </div>

        <!-- 2. Budget par personne -->
        <div class="space-y-2">
          <label for="budget" class="block text-sm font-medium text-gray-700">
            Budget par personne (€) *
          </label>
          <div class="flex items-center space-x-4">
            <input 
              id="budget"
              type="range"
              formControlName="budget"
              min="50"
              max="500"
              step="10"
              class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider"
            />
            <span class="text-lg font-semibold text-gray-900 min-w-[60px]">
              {{ form.get('budget')?.value || 200 }}€
            </span>
          </div>
          <p class="text-xs text-gray-500">Hors transport, pour 2-3 nuits</p>
        </div>

        <!-- 3. Période souhaitée -->
        <div class="space-y-2">
          <label for="period" class="block text-sm font-medium text-gray-700">
            Période souhaitée *
          </label>
          <input 
            id="period"
            type="month"
            formControlName="period"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none"
            [class.border-red-500]="f['period'].invalid && f['period'].touched"
          />
        </div>

        <!-- 4. Durée du séjour -->
        <div class="space-y-2">
          <label for="duration" class="block text-sm font-medium text-gray-700">
            Durée du séjour *
          </label>
          <select 
            id="duration"
            formControlName="duration"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none"
            [class.border-red-500]="f['duration'].invalid && f['duration'].touched"
          >
            <option value="">Sélectionnez une durée</option>
            <option value="1">1 nuit</option>
            <option value="2">2 nuits</option>
            <option value="3">3 nuits</option>
          </select>
        </div>

        <!-- 5. Destination -->
        <div class="space-y-2">
          <label for="destination" class="block text-sm font-medium text-gray-700">
            Destination *
          </label>
          <input 
            id="destination"
            type="text"
            formControlName="destination"
            placeholder="Ex: Barcelone, Amsterdam, Prague..."
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none"
            [class.border-red-500]="f['destination'].invalid && f['destination'].touched"
          />
        </div>

        <!-- 6. Activités préférées -->
        <div class="space-y-2">
          <label for="preferredActivities" class="block text-sm font-medium text-gray-700">
            Activités préférées
          </label>
          <textarea 
            id="preferredActivities"
            formControlName="preferredActivities"
            placeholder="Ex: Restaurant gastronomique, visite culturelle, bar à cocktails..."
            rows="3"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none resize-none"
          ></textarea>
        </div>

        <!-- 7. Activités à éviter -->
        <div class="space-y-2">
          <label for="activitiesToAvoid" class="block text-sm font-medium text-gray-700">
            Activités à éviter
          </label>
          <textarea 
            id="activitiesToAvoid"
            formControlName="activitiesToAvoid"
            placeholder="Ex: Saut à l'élastique, activités aquatiques..."
            rows="3"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none resize-none"
          ></textarea>
        </div>

        <!-- 8. Style de séjour -->
        <div class="space-y-2">
          <label for="style" class="block text-sm font-medium text-gray-700">
            Style de séjour *
          </label>
          <select 
            id="style"
            formControlName="style"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 focus:border-transparent transition-all duration-200 outline-none"
            [class.border-red-500]="f['style'].invalid && f['style'].touched"
          >
            <option value="">Sélectionnez un style</option>
            <option value="detente">Détente</option>
            <option value="fete">Fête</option>
            <option value="aventure">Aventure</option>
            <option value="surprise">Surprise</option>
          </select>
        </div>

        <!-- 9. Consentement -->
        <div class="space-y-2">
          <label class="flex items-start space-x-3 cursor-pointer">
            <input 
              type="checkbox"
              formControlName="consent"
              class="mt-1 h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded"
              [class.border-red-500]="f['consent'].invalid && f['consent'].touched"
            />
            <span class="text-sm text-gray-700">
              J'accepte le traitement de mes réponses pour l'organisation de l'EVG. *
            </span>
          </label>
          <div *ngIf="f['consent'].invalid && f['consent'].touched" class="text-red-500 text-sm" aria-live="polite">
            Le consentement est obligatoire
          </div>
        </div>

        <!-- Messages d'erreur et de succès -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-xl p-4" role="alert">
          <p class="text-red-800 text-sm">{{ errorMessage }}</p>
        </div>

        <div *ngIf="successMessage" class="bg-green-50 border border-green-200 rounded-xl p-4" role="alert">
          <p class="text-green-800 text-sm">{{ successMessage }}</p>
        </div>

        <!-- Bouton d'envoi -->
        <button 
          type="submit"
          [disabled]="form.invalid || isSubmitting"
          class="w-full bg-black text-white py-4 px-6 rounded-xl font-semibold text-lg transition-all duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-gray-800 focus:ring-2 focus:ring-green-400 focus:ring-offset-2"
        >
          <span *ngIf="!isSubmitting">Envoyer mes préférences</span>
          <span *ngIf="isSubmitting" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Envoi en cours...
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
