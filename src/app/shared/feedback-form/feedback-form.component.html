<div class="form-wrapper">
  <div class="form-card">
    <!-- En-tête -->
    <div class="form-header">
      <h1 class="form-title">Préférences EVG</h1>
      <p class="form-subtitle">Partagez vos préférences pour organiser le meilleur EVG</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="feedback-form">
        
      <!-- 1. Prénom -->
      <div class="form-group">
        <label for="firstName" class="form-label">
          Prénom <span class="required">*</span>
        </label>
        <input
          id="firstName"
          type="text"
          formControlName="firstName"
          placeholder="Votre prénom"
          class="form-control"
          [class.error]="f['firstName'].invalid && f['firstName'].touched"
        />
        <div *ngIf="f['firstName'].invalid && f['firstName'].touched" class="error-message" aria-live="polite">
          Le prénom est requis
        </div>
      </div>

      <!-- 2. Budget par personne -->
      <div class="form-group">
        <label for="budget" class="form-label">
          Budget par personne (€) <span class="required">*</span>
        </label>
        <div class="budget-slider">
          <input
            id="budget"
            type="range"
            formControlName="budget"
            min="50"
            max="500"
            step="10"
            class="slider"
          />
          <div class="budget-display">
            {{ form.get('budget')?.value || 200 }}€
          </div>
        </div>
        <p class="form-hint">Hors transport, pour 2-3 nuits</p>
      </div>

      <!-- 3. Période souhaitée -->
      <div class="form-group">
        <label for="period" class="form-label">
          Période souhaitée <span class="required">*</span>
        </label>
        <input
          id="period"
          type="month"
          formControlName="period"
          class="form-control"
          [class.error]="f['period'].invalid && f['period'].touched"
        />
      </div>

      <!-- 4. Durée du séjour -->
      <div class="form-group">
        <label for="duration" class="form-label">
          Durée du séjour <span class="required">*</span>
        </label>
        <select
          id="duration"
          formControlName="duration"
          class="form-control"
          [class.error]="f['duration'].invalid && f['duration'].touched"
        >
          <option value="">Sélectionnez une durée</option>
          <option value="1">1 nuit</option>
          <option value="2">2 nuits</option>
          <option value="3">3 nuits</option>
        </select>
      </div>

      <!-- 5. Destination -->
      <div class="form-group">
        <label for="destination" class="form-label">
          Destination <span class="required">*</span>
        </label>
        <input
          id="destination"
          type="text"
          formControlName="destination"
          placeholder="Ex: Barcelone, Amsterdam, Prague..."
          class="form-control"
          [class.error]="f['destination'].invalid && f['destination'].touched"
        />
      </div>

      <!-- 6. Activités préférées -->
      <div class="form-group">
        <label for="preferredActivities" class="form-label">
          Activités préférées
        </label>
        <textarea
          id="preferredActivities"
          formControlName="preferredActivities"
          placeholder="Ex: Restaurant gastronomique, visite culturelle, bar à cocktails..."
          rows="3"
          class="form-control textarea"
        ></textarea>
      </div>

      <!-- 7. Activités à éviter -->
      <div class="form-group">
        <label for="activitiesToAvoid" class="form-label">
          Activités à éviter
        </label>
        <textarea
          id="activitiesToAvoid"
          formControlName="activitiesToAvoid"
          placeholder="Ex: Saut à l'élastique, activités aquatiques..."
          rows="3"
          class="form-control textarea"
        ></textarea>
      </div>

      <!-- 8. Style de séjour -->
      <div class="form-group">
        <label for="style" class="form-label">
          Style de séjour <span class="required">*</span>
        </label>
        <select
          id="style"
          formControlName="style"
          class="form-control"
          [class.error]="f['style'].invalid && f['style'].touched"
        >
          <option value="">Sélectionnez un style</option>
          <option value="detente">Détente</option>
          <option value="fete">Fête</option>
          <option value="aventure">Aventure</option>
          <option value="surprise">Surprise</option>
        </select>
      </div>

      <!-- 9. Consentement -->
      <div class="form-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            formControlName="consent"
            class="checkbox"
            [class.error]="f['consent'].invalid && f['consent'].touched"
          />
          <span class="checkbox-text">
            J'accepte le traitement de mes réponses pour l'organisation de l'EVG. <span class="required">*</span>
          </span>
        </label>
        <div *ngIf="f['consent'].invalid && f['consent'].touched" class="error-message" aria-live="polite">
          Le consentement est obligatoire
        </div>
      </div>

      <!-- Messages d'erreur et de succès -->
      <div *ngIf="errorMessage" class="alert alert-error" role="alert">
        <span class="alert-icon">⚠️</span>
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success" role="alert">
        <span class="alert-icon">✓</span>
        {{ successMessage }}
      </div>

      <!-- Bouton d'envoi -->
      <button
        type="submit"
        [disabled]="form.invalid || isSubmitting"
        class="submit-button"
      >
        <span *ngIf="!isSubmitting">Envoyer mes préférences</span>
        <span *ngIf="isSubmitting" class="loading-state">
          <span class="spinner"></span>
          Envoi en cours...
        </span>
      </button>
    </form>
  </div>
</div>
